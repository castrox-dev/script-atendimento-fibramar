<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Script de Atendimento - Fibramar Internet</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #a855f7;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dark-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --surface-gradient: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
            
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-dark-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-dark-border: rgba(255, 255, 255, 0.12);
            
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.1), 0 15px 15px -10px rgba(0, 0, 0, 0.05);
            --premium-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(168, 85, 247, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.1) 0, transparent 50%);
            min-height: 100vh;
            padding: 20px;
            color: #1e293b;
            transition: var(--transition);
            line-height: 1.5;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: #f1f5f9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            overflow: visible;
            transition: var(--transition);
        }

        body.dark-mode .container {
            background: var(--glass-dark-bg);
            border-color: var(--glass-dark-border);
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 80px 40px 100px 40px;
            text-align: center;
            position: relative;
            min-height: 320px;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 86c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm66-3c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm-46-4c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm33-31c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM46 44c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM28 24c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='white' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
            animation: backgroundMove 60s linear infinite;
        }

        @keyframes backgroundMove {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        body.dark-mode .header {
            background: var(--dark-gradient);
        }

        .header-info {
            position: absolute;
            top: 30px;
            left: 35px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .datetime-widget {
            font-size: 0.95em;
            letter-spacing: 0.8px;
            font-weight: 700;
            color: white;
        }

        .weather-widget {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .name-config {
            position: absolute;
            bottom: 30px;
            left: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .name-config label {
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .name-config input {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            outline: none;
            transition: var(--transition);
            width: 160px;
        }

        .name-config input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
            width: 180px;
        }

        .header h1 {
            font-size: 3.8em;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -2.5px;
            text-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.3em;
            opacity: 0.95;
            font-weight: 500;
            max-width: 650px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
        }

        .theme-toggle {
            position: absolute;
            top: 30px;
            right: 35px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            padding: 12px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 0.95em;
            font-weight: 700;
            transition: var(--transition);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .content {
            padding: 40px;
            transition: var(--transition);
        }

        .topic {
            margin-bottom: 24px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        body.dark-mode .topic {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .topic:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        .topic-header {
            background: #ffffff;
            color: #1e293b;
            padding: 24px 32px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.dark-mode .topic-header {
            background: #1e293b;
            color: #f1f5f9;
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        .topic-header:hover {
            background: #f8fafc;
        }

        body.dark-mode .topic-header:hover {
            background: #334155;
        }

        .topic-header h2 {
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .topic-icon {
            font-size: 1.4em;
            opacity: 0.4;
            transition: var(--transition);
        }

        .topic.active .topic-icon {
            transform: rotate(180deg);
            opacity: 1;
            color: var(--primary);
        }

        .messages {
            display: none;
            background: #f8fafc;
            padding: 32px;
            transition: var(--transition);
        }

        body.dark-mode .messages {
            background: #0f172a;
        }

        .topic.active .messages {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .message-item {
            background: white;
            padding: 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            position: relative;
            white-space: pre-wrap;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        body.dark-mode .message-item {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .message-item:hover {
            background: #ffffff;
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -10px rgba(99, 102, 241, 0.2);
        }

        body.dark-mode .message-item:hover {
            background: #334155;
            border-color: var(--secondary);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.3);
        }

        .message-item::after {
            content: '📋 Copiar';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.7em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            opacity: 0;
            transition: var(--transition);
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 6px;
        }

        body.dark-mode .message-item::after {
            color: #a5b4fc;
            background: #312e81;
        }

        .message-item:hover::after {
            opacity: 1;
        }

        .message-text {
            line-height: 1.6;
            color: #475569;
            font-size: 0.95em;
            flex: 1;
        }

        body.dark-mode .message-text {
            color: #cbd5e1;
        }

        .message-title {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        body.dark-mode .message-title {
            color: #a5b4fc;
        }

        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notification::before {
            content: '✓';
            background: var(--success);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .search-box {
            margin-bottom: 40px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 22px 30px;
            font-size: 1.15em;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: var(--radius-md);
            outline: none;
            transition: var(--transition);
            background: white;
            color: #1e293b;
            box-shadow: var(--premium-shadow);
        }

        body.dark-mode .search-box input {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.15), var(--hover-shadow);
            transform: translateY(-2px);
        }

        .search-advanced-toggle {
            background: rgba(99, 102, 241, 0.05);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            margin-top: 15px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        body.dark-mode .search-advanced-toggle {
            background: rgba(165, 180, 252, 0.05);
            color: #a5b4fc;
            border-color: rgba(165, 180, 252, 0.1);
        }

        .search-advanced-toggle:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        .search-advanced-panel {
            margin-top: 20px;
            padding: 30px;
            background: white;
            border-radius: var(--radius-md);
            display: none;
            gap: 25px;
            flex-direction: column;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        body.dark-mode .search-advanced-panel {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .search-advanced-panel.show {
            display: flex;
            animation: slideUp 0.4s ease;
        }

        .search-filter-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-filter-group label {
            font-weight: 800;
            font-size: 0.8em;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        body.dark-mode .search-filter-group label {
            color: #94a3b8;
        }

        .search-filter-select, .search-tags-input {
            padding: 14px 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 1em;
            background: #f8fafc;
            color: #1e293b;
            cursor: pointer;
            transition: var(--transition);
        }

        body.dark-mode .search-filter-select, 
        body.dark-mode .search-tags-input {
            background: #0f172a;
            border-color: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }

        .search-filter-select:focus, .search-tags-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        body.dark-mode .search-filter-select:focus, 
        body.dark-mode .search-tags-input:focus {
            background: #0f172a;
        }

        .search-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .search-btn-apply {
            flex: 2;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .search-btn-clear {
            flex: 1;
            padding: 16px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .search-btn-clear:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* Micro-interactions */
        .message-item:active {
            transform: scale(0.98);
        }

        .calc-button:active {
            transform: scale(0.96);
        }

        /* Utility Classes */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
        }

        body.dark-mode .glass-panel {
            background: var(--glass-dark-bg);
            border-color: var(--glass-dark-border);
        }

        @keyframes modalSlideUp {
            from { transform: translateY(40px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes backgroundMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsividade Avançada */
        @media (max-width: 1024px) {
            .container {
                margin: 10px;
                border-radius: var(--radius-md);
            }
            
            .header h1 {
                font-size: 3em;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 60px 20px 80px 20px;
                min-height: auto;
                flex-direction: column;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .header h1 {
                font-size: 2.2em;
                letter-spacing: -1px;
                margin-top: 20px;
            }

            .header p {
                font-size: 1.1em;
                margin-bottom: 20px;
            }

            .theme-toggle {
                position: absolute;
                top: 15px;
                right: 15px;
                padding: 8px 16px;
                font-size: 0.85em;
            }

            .name-config {
                position: relative;
                bottom: auto;
                left: auto;
                margin-top: 20px;
                width: 100%;
                max-width: 350px;
                flex-direction: column;
                gap: 10px;
                padding: 15px;
                order: 3;
            }

            .name-config input {
                width: 100%;
                font-size: 16px;
            }

            .content {
                padding: 15px;
            }

            .topic-header {
                padding: 15px;
            }

            .topic.active .messages {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .message-item {
                padding: 15px;
            }

            .message-item h4 {
                font-size: 1em;
            }

            .search-box {
                flex-direction: column;
                gap: 10px;
            }

            .search-advanced-toggle {
                width: 100%;
                justify-content: center;
            }

            .search-advanced-panel {
                width: 100%;
                padding: 15px;
            }

            .search-filter-group select,
            .search-filter-group input {
                font-size: 16px;
            }

            .floating-buttons {
                right: 15px;
                bottom: 15px;
                gap: 10px;
                left: auto;
            }

            .float-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2em;
            }

            .calculator {
                width: 95%;
                max-height: 90vh;
                padding: 20px;
                overflow-y: auto;
                border-radius: var(--radius-md);
                height: auto;
            }

            .calc-grid {
                grid-template-columns: 1fr !important;
            }

            .footer-credits {
                padding: 40px 20px;
                margin-top: 20px;
            }

            .topic-header h2 {
                font-size: 1.1em;
            }

            .message-item::after {
                display: none;
            }

            .container {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 1em;
            }

            .footer-links {
                gap: 15px;
            }

            .footer-link {
                width: 40px;
                height: 40px;
                font-size: 1.1em;
            }
        }

        /* Footer Style */

        // Tema
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const body = document.body;

        // Carregar tema salvo
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light';
        }

        // Alternar tema
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            }
        });

        // Renderizar tópicos
        function renderTopics(data = scriptData, searchTerm = '') {
            const topicsContainer = document.getElementById('topics');
            topicsContainer.innerHTML = '';

            for (const [topicName, content] of Object.entries(data)) {
                // Verificar se é o tópico de senhas com estrutura especial
                if (content.type === 'passwords') {
                    renderPasswordTopic(topicName, content, searchTerm);
                    continue;
                }

                const messages = content;
                
                // Filtrar mensagens se houver termo de busca
                let filteredMessages = messages;
                if (searchTerm) {
                    filteredMessages = messages.filter(msg => {
                        const searchText = (typeof msg === 'object' && msg !== null) 
                            ? (msg.title + ' ' + msg.content).toLowerCase()
                            : msg.toLowerCase();
                        return searchText.includes(searchTerm.toLowerCase()) ||
                               topicName.toLowerCase().includes(searchTerm.toLowerCase());
                    });
                    
                    // Pular tópico se não houver mensagens correspondentes
                    if (filteredMessages.length === 0) continue;
                }

                const topicDiv = document.createElement('div');
                topicDiv.className = 'topic';

                const topicHeader = document.createElement('div');
                topicHeader.className = 'topic-header';
                topicHeader.innerHTML = `
                    <h2>${topicName}</h2>
                    <span class="topic-icon">▼</span>
                `;

                const messagesDiv = document.createElement('div');
                messagesDiv.className = 'messages';

                filteredMessages.forEach(message => {
                    const messageItem = document.createElement('div');
                    messageItem.className = 'message-item';
                    
                    // Extrair título e conteúdo se for objeto
                    let title = '';
                    let contentToDisplay = message;
                    
                    if (typeof message === 'object' && message !== null && message.title) {
                        title = message.title;
                        contentToDisplay = message.content;
                    }
                    
                    if (title) {
                        const titleEl = document.createElement('div');
                        titleEl.className = 'message-title';
                        titleEl.textContent = title;
                        messageItem.appendChild(titleEl);
                    }
                    
                    const messageText = document.createElement('div');
                    messageText.className = 'message-text';
                    messageText.textContent = contentToDisplay;
                    
                    messageItem.appendChild(messageText);
                    // Usar a mensagem original para copiar
                    messageItem.addEventListener('click', () => copyToClipboard(message));
                    
                    messagesDiv.appendChild(messageItem);
                });

                topicHeader.addEventListener('click', () => {
                    topicDiv.classList.toggle('active');
                });

                topicDiv.appendChild(topicHeader);
                topicDiv.appendChild(messagesDiv);
                topicsContainer.appendChild(topicDiv);
            }
        }

        // Renderizar tópico de senhas com estrutura especial
        function renderPasswordTopic(topicName, content, searchTerm) {
            const topicsContainer = document.getElementById('topics');
            
            const topicDiv = document.createElement('div');
            topicDiv.className = 'topic';

            const topicHeader = document.createElement('div');
            topicHeader.className = 'topic-header';
            topicHeader.innerHTML = `
                <h2>${topicName}</h2>
                <span class="topic-icon">▼</span>
            `;

            const messagesDiv = document.createElement('div');
            messagesDiv.className = 'messages';

            let hasVisibleItems = false;

            content.items.forEach(item => {
                const isHeader = !item.credentials || item.credentials.length === 0;

                if (searchTerm) {
                    const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.credentials && item.credentials.some(cred => {
                            const isObject = typeof cred === 'object' && cred !== null;
                            const user = isObject ? (cred.user || '') : '';
                            const pass = isObject ? (cred.password || '') : String(cred);
                            return user.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                   pass.toLowerCase().includes(searchTerm.toLowerCase());
                        }));
                    if (!matchesSearch) return;
                }

                hasVisibleItems = true;

                const groupDiv = document.createElement('div');

                groupDiv.style.display = 'flex';

                        passwordSpan.style.fontSize = '1.05em';
                        passwordSpan.style.wordBreak = 'break-all';
                        passwordSpan.style.color = body.classList.contains('dark-mode') ? '#f1f5f9' : '#1e293b';
                        passwordSpan.textContent = passwordText;

                        credDiv.appendChild(passwordSpan);

                        // Copiar apenas a senha ao clicar
                        credDiv.addEventListener('click', (e) => {
                            e.stopPropagation();
                            copyToClipboard(passwordText);
                        });

                        cardsContainer.appendChild(credDiv);
                    });

                    groupDiv.appendChild(cardsContainer);
                }

                messagesDiv.appendChild(groupDiv);
            });

            if (!hasVisibleItems && searchTerm) return;

            topicHeader.addEventListener('click', () => {
                topicDiv.classList.toggle('active');
            });

            topicDiv.appendChild(topicHeader);
            topicDiv.appendChild(messagesDiv);
            topicsContainer.appendChild(topicDiv);
        }

        // --- Substitui variáveis e adiciona saudação automática ---
        function replaceVariables(text) {
            const attendantName = document.getElementById('attendantName').value || '';
            const now = new Date();
            const dia = String(now.getDate()).padStart(2, '0');
            const mes = String(now.getMonth() + 1).padStart(2, '0');
            const ano = String(now.getFullYear()).slice(-2);
            const hora = String(now.getHours()).padStart(2, '0');
            const minuto = String(now.getMinutes()).padStart(2, '0');

            const dataAtual = `${dia}/${mes}/${ano}`;
            const horaAtual = `${hora}:${minuto}`;

            // Saudação automática conforme o horário
            let periodo = "";
            const horaNum = now.getHours();
            if (horaNum >= 5 && horaNum < 12) {
                periodo = "Bom dia";
            } else if (horaNum >= 12 && horaNum < 18) {
                periodo = "Boa tarde";
            } else {
                periodo = "Boa noite";
            }

            // Lógica de vencimento automático
            let vencimentoAuto = "";
            const diaNum = now.getDate();
            if (diaNum >= 2 && diaNum <= 10) {
                vencimentoAuto = "02, 06 ou 09";
            } else if (diaNum >= 11 && diaNum <= 20) {
                vencimentoAuto = "13 ou 18";
            } else {
                vencimentoAuto = "22, 26 ou 01";
            }

            return text
                .replace(/\[PERIODO\]/g, periodo)
                .replace(/\[NOME_ATENDENTE\]/g, attendantName)
                .replace(/\[DATA\]/g, dataAtual)
                .replace(/\[HORA\]/g, horaAtual)
                .replace(/\[VENCIMENTO_AUTO\]/g, vencimentoAuto);
        }

        // Copiar para área de transferência
        function copyToClipboard(input) {
            const attendantNameInput = document.getElementById('attendantName');
            const attendantName = attendantNameInput.value.trim();

            if (!attendantName) {
                attendantNameInput.style.borderColor = '#ef4444';
                attendantNameInput.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.1)';
                attendantNameInput.focus();
                
                // Mostrar notificação de erro
                const notification = document.getElementById('notification');
                notification.textContent = '⚠️ Digite seu nome antes de copiar!';
                notification.style.background = '#ef4444';
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    // Resetar estilos após um tempo
                    setTimeout(() => {
                        notification.textContent = '✓ Mensagem copiada!';
                        notification.style.background = '';
                    }, 300);
                }, 2000);
                
                return;
            }

            // Resetar estilos caso o nome esteja preenchido
            attendantNameInput.style.borderColor = '';
            attendantNameInput.style.boxShadow = '';

            // Rastrear uso
            trackMessageUsage(input);

            // Se for objeto com title e content, pegar apenas o content
            const textToProcess = (typeof input === 'object' && input !== null && input.content) 
                ? input.content 
                : input;
            
            let textAtualizado = replaceVariables(textToProcess);
            
            navigator.clipboard.writeText(textAtualizado).then(() => {
                showNotification();
            }).catch(err => {
                console.error('Erro ao copiar:', err);
            });
        }

        // Mostrar notificação
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // Sistema de rastreamento de uso com data
        function trackMessageUsage(input) {
            try {
                // Se for objeto com title e content, pegar apenas o content
                const messageText = (typeof input === 'object' && input !== null && input.content) 
                    ? input.content 
                    : input;

                let usageHistory = JSON.parse(localStorage.getItem('messageUsageHistory') || '[]');
                
                // Adicionar registro de uso
                usageHistory.push({
                    text: messageText,
                    timestamp: new Date().toISOString(),
                    date: new Date().toLocaleDateString('pt-BR'),
                    time: new Date().toLocaleTimeString('pt-BR')
                });
                
                // Manter apenas últimos 1000 registros
                if (usageHistory.length > 1000) {
                    usageHistory = usageHistory.slice(-1000);
                }
                
                localStorage.setItem('messageUsageHistory', JSON.stringify(usageHistory));
            } catch (err) {
                console.error('Erro ao rastrear uso:', err);
            }
        }

        // Busca Avançada
        const searchAdvancedToggle = document.getElementById('searchAdvancedToggle');
        const searchAdvancedPanel = document.getElementById('searchAdvancedPanel');
        const searchTagsInput = document.getElementById('searchTagsInput');
        const searchTagsList = document.getElementById('searchTagsList');
        const searchCategoryFilter = document.getElementById('searchCategoryFilter');
        const searchDateFilter = document.getElementById('searchDateFilter');
        const searchApplyBtn = document.getElementById('searchApplyBtn');
        const searchClearBtn = document.getElementById('searchClearBtn');
        
        let activeTags = [];
        let activeCategory = '';
        let activeDateFilter = '';

        // Popular dropdown de categorias
        function populateCategories() {
            if (!searchCategoryFilter) return;
            
            // Limpar opções existentes (exceto "Todas as categorias")
            while (searchCategoryFilter.children.length > 1) {
                searchCategoryFilter.removeChild(searchCategoryFilter.lastChild);
            }
            
            const categories = Object.keys(scriptData).filter(key => 
                scriptData[key].type !== 'passwords'
            );
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                searchCategoryFilter.appendChild(option);
            });
        }

        // Gerenciar tags
        function addTag(tagText) {
            const tag = tagText.trim().replace(/^#/, '');
            if (tag && !activeTags.includes(tag)) {
                activeTags.push(tag);
                renderTags();
            }
        }

        function removeTag(tagText) {
            activeTags = activeTags.filter(t => t !== tagText);
            renderTags();
        }

        function renderTags() {
            if (!searchTagsList) return;
            
            searchTagsList.innerHTML = '';
            activeTags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'search-tag';
                tagEl.innerHTML = `#${tag} <span class="tag-remove" onclick="removeTagFromSearch('${tag}')">×</span>`;
                searchTagsList.appendChild(tagEl);
            });
        }

        window.removeTagFromSearch = function(tag) {
            removeTag(tag);
        };

        searchTagsInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const value = searchTagsInput.value.trim();
                if (value) {
                    // Processar múltiplas tags separadas por vírgula
                    value.split(',').forEach(tag => {
                        const cleanTag = tag.trim().replace(/^#/, '');
                        if (cleanTag) {
                            addTag(cleanTag);
                        }
                    });
                    searchTagsInput.value = '';
                }
            }
        });

        // Toggle painel de busca avançada
        if (searchAdvancedToggle) {
            searchAdvancedToggle.addEventListener('click', () => {
                searchAdvancedPanel.classList.toggle('show');
                if (searchAdvancedPanel.classList.contains('show')) {
                    populateCategories();
                }
            });
        }

        // Aplicar filtros de busca avançada
        function applyAdvancedSearch() {
            activeCategory = searchCategoryFilter ? searchCategoryFilter.value : '';
            activeDateFilter = searchDateFilter ? searchDateFilter.value : '';
            
            const searchTerm = document.getElementById('searchInput').value;
            performAdvancedSearch(searchTerm);
        }

        // Função principal de busca avançada
        function performAdvancedSearch(searchTerm = '') {
            let filteredData = { ...scriptData };
            
            // Filtrar por categoria
            if (activeCategory) {
                const filtered = {};
                if (filteredData[activeCategory]) {
                    filtered[activeCategory] = filteredData[activeCategory];
                }
                filteredData = filtered;
            }
            
            // Filtrar por tags
            if (activeTags.length > 0) {
                const tagFiltered = {};
                for (const [topicName, content] of Object.entries(filteredData)) {
                    if (content.type === 'passwords') {
                        tagFiltered[topicName] = content;
                        continue;
                    }
                    
                    const filteredMessages = content.filter(msg => {
                        const msgText = (typeof msg === 'object' && msg !== null) 
                            ? (msg.title + ' ' + msg.content) 
                            : msg;
                        const msgLower = msgText.toLowerCase();
                        return activeTags.some(tag => 
                            msgLower.includes(tag.toLowerCase()) ||
                            msgLower.includes('#' + tag.toLowerCase())
                        );
                    });
                    
                    if (filteredMessages.length > 0) {
                        tagFiltered[topicName] = filteredMessages;
                    }
                }
                filteredData = tagFiltered;
            }
            
            // Filtrar por data de uso
            if (activeDateFilter) {
                try {
                    const usageHistory = JSON.parse(localStorage.getItem('messageUsageHistory') || '[]');
                    const now = new Date();
                    let dateLimit = new Date();
                    
                    switch(activeDateFilter) {
                        case 'today':
                            dateLimit.setHours(0, 0, 0, 0);
                            break;
                        case 'week':
                            dateLimit.setDate(now.getDate() - 7);
                            break;
                        case 'month':
                            dateLimit.setDate(now.getDate() - 30);
                            break;
                        case '3months':
                            dateLimit.setDate(now.getDate() - 90);
                            break;
                    }
                    
                    const recentMessages = new Set();
                    usageHistory.forEach(entry => {
                        const entryDate = new Date(entry.timestamp);
                        if (entryDate >= dateLimit) {
                            recentMessages.add(entry.text);
                        }
                    });
                    
                    // Filtrar apenas mensagens usadas recentemente
                    const dateFiltered = {};
                    for (const [topicName, content] of Object.entries(filteredData)) {
                        if (content.type === 'passwords') {
                            dateFiltered[topicName] = content;
                            continue;
                        }
                        
                        const filteredMessages = content.filter(msg => {
                            const msgText = (typeof msg === 'object' && msg !== null) ? msg.content : msg;
                            return recentMessages.has(msgText);
                        });
                        
                        if (filteredMessages.length > 0) {
                            dateFiltered[topicName] = filteredMessages;
                        }
                    }
                    filteredData = dateFiltered;
                } catch (err) {
                    console.error('Erro ao filtrar por data:', err);
                }
            }
            
            // Aplicar busca de texto também
            if (searchTerm) {
                const textFiltered = {};
                const searchLower = searchTerm.toLowerCase();
                
                for (const [topicName, content] of Object.entries(filteredData)) {
                    if (content.type === 'passwords') {
                        if (topicName.toLowerCase().includes(searchLower)) {
                            textFiltered[topicName] = content;
                        } else {
                            // Verificar se algum item ou credencial corresponde à busca
                            const hasMatch = content.items.some(item => 
                                item.title.toLowerCase().includes(searchLower) ||
                                item.credentials.some(cred => {
                                    const isObject = typeof cred === 'object' && cred !== null;
                                    const user = isObject ? (cred.user || '') : '';
                                    const password = isObject ? cred.password : cred;
                                    return user.toLowerCase().includes(searchLower) || 
                                           password.toLowerCase().includes(searchLower);
                                })
                            );
                            if (hasMatch) {
                                textFiltered[topicName] = content;
                            }
                        }
                        continue;
                    }
                    
                    const filteredMessages = content.filter(msg => {
                        const msgText = (typeof msg === 'object' && msg !== null) 
                            ? (msg.title + ' ' + msg.content) 
                            : msg;
                        return msgText.toLowerCase().includes(searchLower) ||
                               topicName.toLowerCase().includes(searchLower);
                    });
                    
                    if (filteredMessages.length > 0) {
                        textFiltered[topicName] = filteredMessages;
                    }
                }
                filteredData = textFiltered;
            }
            
            renderTopics(filteredData, searchTerm);
        }

        // Event listeners
        if (searchApplyBtn) {
            searchApplyBtn.addEventListener('click', () => {
                applyAdvancedSearch();
            });
        }

        if (searchClearBtn) {
            searchClearBtn.addEventListener('click', () => {
                activeTags = [];
                activeCategory = '';
                activeDateFilter = '';
                
                if (searchTagsInput) searchTagsInput.value = '';
                if (searchTagsList) searchTagsList.innerHTML = '';
                if (searchCategoryFilter) searchCategoryFilter.value = '';
                if (searchDateFilter) searchDateFilter.value = '';
                
                const searchTerm = document.getElementById('searchInput').value;
                renderTopics(scriptData, searchTerm);
            });
        }

        // Busca básica também aplica filtros se estiverem ativos
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value;
            if (activeTags.length > 0 || activeCategory || activeDateFilter) {
                performAdvancedSearch(searchTerm);
            } else {
                renderTopics(scriptData, searchTerm);
            }
        });

        // Renderizar inicialmente
        renderTopics();

        // Atualizar variáveis quando o nome do atendente for alterado
        const attendantNameInput = document.getElementById('attendantName');
        
        // Carregar nome do atendente salvo
        const savedAttendantName = localStorage.getItem('attendantName');
        if (savedAttendantName) {
            attendantNameInput.value = savedAttendantName;
        }
        
        attendantNameInput.addEventListener('input', function() {
            // Salvar nome do atendente no localStorage
            localStorage.setItem('attendantName', attendantNameInput.value);
            // Resetar estilos de erro se começar a digitar
            if (attendantNameInput.value.trim()) {
                attendantNameInput.style.borderColor = '';
                attendantNameInput.style.boxShadow = '';
            }
            // Re-renderizar todos os tópicos com as variáveis atualizadas
            renderTopics();
        });

        // Calculadora Financeira (Modal)
        const calculatorBackdrop = document.getElementById('calculatorBackdrop');
        const calculatorOpenBtn = document.getElementById('calculatorOpenBtn');
        const calculatorClose = document.getElementById('calculatorClose');

        console.log('Calculator elements:', {
            backdrop: calculatorBackdrop,
            openBtn: calculatorOpenBtn,
            closeBtn: calculatorClose
        });

        // Abrir calculadora
        if (calculatorOpenBtn) {
            calculatorOpenBtn.addEventListener('click', () => {
                console.log('Botão clicado!');
                calculatorBackdrop.classList.add('show');
            });
        } else {
            console.error('Botão da calculadora não encontrado!');
        }

        // Fechar calculadora
        if (calculatorClose) {
            calculatorClose.addEventListener('click', () => {
                calculatorBackdrop.classList.remove('show');
            });
        }

        // Fechar ao clicar no backdrop
        if (calculatorBackdrop) {
            calculatorBackdrop.addEventListener('click', (e) => {
                if (e.target === calculatorBackdrop) {
                    calculatorBackdrop.classList.remove('show');
                }
            });
        }

        // Fechar com tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && calculatorBackdrop.classList.contains('show')) {
                calculatorBackdrop.classList.remove('show');
            }
        });

        // Cálculo Proporcional
        const calcProporcionalBtn = document.getElementById('calcProporcional');
        const valorPlanoInput = document.getElementById('valorPlano');
        const diasMesInput = document.getElementById('diasMes');
        const diasUtilizadosInput = document.getElementById('diasUtilizados');
        const resultProporcional = document.getElementById('resultProporcional');
        const valorProporcionalSpan = document.getElementById('valorProporcional');

        calcProporcionalBtn.addEventListener('click', () => {
            const valorPlano = parseFloat(valorPlanoInput.value);
            const diasMes = parseInt(diasMesInput.value);
            const diasUtilizados = parseInt(diasUtilizadosInput.value);

            if (!valorPlano || !diasMes || diasUtilizados === undefined) {
                alert('Por favor, preencha todos os campos do cálculo proporcional.');
                return;
            }

            if (diasUtilizados > diasMes) {
                alert('Dias utilizados não pode ser maior que dias do mês.');
                return;
            }

            const valorProporcional = (valorPlano / diasMes) * diasUtilizados;
            valorProporcionalSpan.textContent = `R$ ${valorProporcional.toFixed(2).replace('.', ',')}`;
            resultProporcional.classList.add('show');
        });

        // Cálculo de Acordo (1 fatura e meia)
        const calcAcordoBtn = document.getElementById('calcAcordo');
        const valorFaturaInput = document.getElementById('valorFatura');
        const resultAcordo = document.getElementById('resultAcordo');
        const valorAcordoSpan = document.getElementById('valorAcordo');

        calcAcordoBtn.addEventListener('click', () => {
            const valorFatura = parseFloat(valorFaturaInput.value);

            if (!valorFatura) {
                alert('Por favor, informe o valor da fatura.');
                return;
            }

            const valorAcordo = valorFatura * 1.5;
            valorAcordoSpan.textContent = `R$ ${valorAcordo.toFixed(2).replace('.', ',')}`;
            resultAcordo.classList.add('show');
        });

        // Cálculo de Comissão
        const calcComissaoBtn = document.getElementById('calcComissao');
        const qtdCadastrosInput = document.getElementById('qtdCadastros');
        const valorAcordosInput = document.getElementById('valorAcordos');
        const resultComissao = document.getElementById('resultComissao');
        const valorComissaoSpan = document.getElementById('valorComissao');
        const detalhesComissao = document.getElementById('detalhesComissao');

        calcComissaoBtn.addEventListener('click', () => {
            const qtdCadastros = parseInt(qtdCadastrosInput.value) || 0;
            const valorAcordos = parseFloat(valorAcordosInput.value) || 0;

            // R$ 3,00 por cadastro + metade do valor dos acordos
            const comissaoCadastros = qtdCadastros * 3;
            const comissaoAcordos = valorAcordos / 2;
            const comissaoTotal = comissaoCadastros + comissaoAcordos;

            valorComissaoSpan.textContent = `R$ ${comissaoTotal.toFixed(2).replace('.', ',')}`;
            detalhesComissao.innerHTML = `
                Cadastros: ${qtdCadastros} × R$ 3,00 = R$ ${comissaoCadastros.toFixed(2).replace('.', ',')}<br>
                Acordos: R$ ${valorAcordos.toFixed(2).replace('.', ',')} ÷ 2 = R$ ${comissaoAcordos.toFixed(2).replace('.', ',')}
            `;
            resultComissao.classList.add('show');
        });

        // Formatar inputs para aceitar vírgula como decimal
        [valorPlanoInput, valorFaturaInput, valorAcordosInput].forEach(input => {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(',', '.');
                e.target.value = value;
            });
        });
        }); // Fim do DOMContentLoaded
    </script>
</body>
</html>
