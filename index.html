<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Script de Atendimento - Fibramar Internet</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #a855f7;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dark-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --surface-gradient: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
            
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-dark-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-dark-border: rgba(255, 255, 255, 0.12);
            
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.1), 0 15px 15px -10px rgba(0, 0, 0, 0.05);
            --premium-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(168, 85, 247, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.1) 0, transparent 50%);
            min-height: 100vh;
            padding: 20px;
            color: #1e293b;
            transition: var(--transition);
            line-height: 1.5;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: #f1f5f9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            overflow: visible;
            transition: var(--transition);
        }

        body.dark-mode .container {
            background: var(--glass-dark-bg);
            border-color: var(--glass-dark-border);
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 80px 40px 100px 40px;
            text-align: center;
            position: relative;
            min-height: 320px;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 86c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm66-3c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm-46-4c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm33-31c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM46 44c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM28 24c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='white' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
            animation: backgroundMove 60s linear infinite;
        }

        @keyframes backgroundMove {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        body.dark-mode .header {
            background: var(--dark-gradient);
        }

        .header-info {
            position: absolute;
            top: 30px;
            left: 35px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .datetime-widget {
            font-size: 0.95em;
            letter-spacing: 0.8px;
            font-weight: 700;
            color: white;
        }

        .weather-widget {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .name-config {
            position: absolute;
            bottom: 30px;
            left: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .name-config label {
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .name-config input {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            outline: none;
            transition: var(--transition);
            width: 160px;
        }

        .name-config input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
            width: 180px;
        }

        .header h1 {
            font-size: 3.8em;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -2.5px;
            text-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.3em;
            opacity: 0.95;
            font-weight: 500;
            max-width: 650px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
        }

        .theme-toggle {
            position: absolute;
            top: 30px;
            right: 35px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            padding: 12px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 0.95em;
            font-weight: 700;
            transition: var(--transition);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .content {
            padding: 40px;
            transition: var(--transition);
        }

        .topic {
            margin-bottom: 24px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        body.dark-mode .topic {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .topic:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        .topic-header {
            background: #ffffff;
            color: #1e293b;
            padding: 24px 32px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.dark-mode .topic-header {
            background: #1e293b;
            color: #f1f5f9;
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        .topic-header:hover {
            background: #f8fafc;
        }

        body.dark-mode .topic-header:hover {
            background: #334155;
        }

        .topic-header h2 {
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .topic-icon {
            font-size: 1.4em;
            opacity: 0.4;
            transition: var(--transition);
        }

        .topic.active .topic-icon {
            transform: rotate(180deg);
            opacity: 1;
            color: var(--primary);
        }

        .messages {
            display: none;
            background: #f8fafc;
            padding: 32px;
            transition: var(--transition);
        }

        body.dark-mode .messages {
            background: #0f172a;
        }

        .topic.active .messages {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .message-item {
            background: white;
            padding: 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            position: relative;
            white-space: pre-wrap;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        body.dark-mode .message-item {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .message-item:hover {
            background: #ffffff;
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -10px rgba(99, 102, 241, 0.2);
        }

        body.dark-mode .message-item:hover {
            background: #334155;
            border-color: var(--secondary);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.3);
        }

        .message-item::after {
            content: '📋 Copiar';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.7em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            opacity: 0;
            transition: var(--transition);
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 6px;
        }

        body.dark-mode .message-item::after {
            color: #a5b4fc;
            background: #312e81;
        }

        .message-item:hover::after {
            opacity: 1;
        }

        .message-text {
            line-height: 1.6;
            color: #475569;
            font-size: 0.95em;
            flex: 1;
        }

        body.dark-mode .message-text {
            color: #cbd5e1;
        }

        .message-title {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        body.dark-mode .message-title {
            color: #a5b4fc;
        }

        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notification::before {
            content: '✓';
            background: var(--success);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .search-box {
            margin-bottom: 40px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 22px 30px;
            font-size: 1.15em;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: var(--radius-md);
            outline: none;
            transition: var(--transition);
            background: white;
            color: #1e293b;
            box-shadow: var(--premium-shadow);
        }

        body.dark-mode .search-box input {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.15), var(--hover-shadow);
            transform: translateY(-2px);
        }

        /* Botões de Apoio (Carteiras e Vencimentos) */
        .info-balloons {
            display: none;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            animation: slideDown 0.3s ease;
        }

        .info-balloons.show {
            display: flex;
        }

        .support-buttons-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .support-toggle-btn {
            background: rgba(99, 102, 241, 0.05);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
        }

        .support-toggle-btn:hover {
            background: var(--primary-gradient);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        body.dark-mode .support-toggle-btn {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .support-toggle-btn:hover {
            background: var(--primary-gradient);
        }

        body.dark-mode .support-toggle-btn {
            background: rgba(165, 180, 252, 0.05);
            color: #a5b4fc;
            border-color: rgba(165, 180, 252, 0.1);
        }

        .support-toggle-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-balloon {
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: 600;
            color: var(--primary);
        }

        body.dark-mode .info-balloon {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
            color: #a5b4fc;
        }

        .info-balloon:hover {
            transform: translateY(-3px);
            box-shadow: var(--hover-shadow);
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .info-balloon span {
            font-size: 1.2em;
        }

        /* Novos Estilos do Modal de Apoio */
        .support-boxes-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .support-boxes-container.show {
            display: flex;
        }

        .support-modal-wrapper {
            background: var(--bg-light);
            width: 95%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .support-modal-wrapper {
            background: var(--bg-dark);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .support-modal-header {
            padding: 25px 35px;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .support-modal-header h2 {
            font-size: 1.5em;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-support-modal {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .close-support-modal:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .support-modal-body {
            padding: 30px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .support-box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        body.dark-mode .support-box {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .support-box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(99, 102, 241, 0.1);
        }

        .support-box-title {
            font-weight: 800;
            font-size: 1.2em;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .support-box-content {
            flex: 1;
        }

        .support-grid {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .support-section {
            margin-bottom: 25px;
        }

        .support-section-title {
            font-size: 0.8em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.dark-mode .support-section-title {
            color: #94a3b8;
        }

        .support-card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        body.dark-mode .support-card {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .support-card:hover {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        body.dark-mode .support-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .support-card-title {
            font-weight: 700;
            font-size: 0.95em;
            color: var(--primary);
        }

        body.dark-mode .support-card-title {
            color: #a5b4fc;
        }

        .support-card-info {
            font-size: 0.85em;
            color: #475569;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        body.dark-mode .support-card-info {
            color: #cbd5e1;
        }

        .support-id-badge {
            background: var(--primary-gradient);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 700;
            display: inline-block;
            margin-right: 5px;
        }

        .support-id-badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 2px 6px;

        // Renderizar tópicos
        function renderTopics(data = scriptData, searchTerm = '') {
            const topicsContainer = document.getElementById('topics');
            topicsContainer.innerHTML = '';

            for (const [topicName, content] of Object.entries(data)) {
                // Verificar se é o tópico de senhas com estrutura especial
                if (content.type === 'passwords') {
                    renderPasswordTopic(topicName, content, searchTerm);
                    continue;
                }

                const messages = content;
                
                // Filtrar mensagens se houver termo de busca
                let filteredMessages = messages;
                if (searchTerm) {
                    filteredMessages = messages.filter(msg => {
                        const searchText = (typeof msg === 'object' && msg !== null) 
                            ? (msg.title + ' ' + msg.content).toLowerCase()
                            : msg.toLowerCase();
                        return searchText.includes(searchTerm.toLowerCase()) ||
                               topicName.toLowerCase().includes(searchTerm.toLowerCase());
                    });
                    
                    // Pular tópico se não houver mensagens correspondentes
                    if (filteredMessages.length === 0) continue;
                }

                const topicDiv = document.createElement('div');
                topicDiv.className = 'topic';

                const topicHeader = document.createElement('div');
                topicHeader.className = 'topic-header';
                topicHeader.innerHTML = `
                    <h2>${topicName}</h2>
                    <span class="topic-icon">▼</span>
                `;

                const messagesDiv = document.createElement('div');
                messagesDiv.className = 'messages';

                filteredMessages.forEach(message => {
                    const messageItem = document.createElement('div');
                    messageItem.className = 'message-item';
                    
                    // Extrair título e conteúdo se for objeto
                    let title = '';
                    let contentToDisplay = message;
                    
                    if (typeof message === 'object' && message !== null && message.title) {
                        title = message.title;
                        contentToDisplay = message.content;
                    }
                    
                    if (title) {
                        const titleEl = document.createElement('div');
                        titleEl.className = 'message-title';
                        titleEl.textContent = title;
                        messageItem.appendChild(titleEl);
                    }
                    
                    const messageText = document.createElement('div');
                    messageText.className = 'message-text';
                    messageText.textContent = contentToDisplay;
                    
                    messageItem.appendChild(messageText);
                    // Usar a mensagem original para copiar
                    messageItem.addEventListener('click', () => copyToClipboard(message));
                    
                    messagesDiv.appendChild(messageItem);
                });

                topicHeader.addEventListener('click', () => {
                    topicDiv.classList.toggle('active');
                });

                topicDiv.appendChild(topicHeader);
                topicDiv.appendChild(messagesDiv);
                topicsContainer.appendChild(topicDiv);
            }
        }

        // Renderizar tópico de senhas com estrutura especial
        function renderPasswordTopic(topicName, content, searchTerm) {
            const topicsContainer = document.getElementById('topics');
            
            const topicDiv = document.createElement('div');
            topicDiv.className = 'topic';

            const topicHeader = document.createElement('div');
            topicHeader.className = 'topic-header';
            topicHeader.innerHTML = `
                <h2>${topicName}</h2>
                <span class="topic-icon">▼</span>
            `;

            const messagesDiv = document.createElement('div');
            messagesDiv.className = 'messages';

            let hasVisibleItems = false;

            content.items.forEach(item => {
                const isHeader = !item.credentials || item.credentials.length === 0;

                if (searchTerm) {
                    const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.credentials && item.credentials.some(cred => {
                            const isObject = typeof cred === 'object' && cred !== null;
                            const user = isObject ? (cred.user || '') : '';
                            const pass = isObject ? (cred.password || '') : String(cred);
                            return user.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                   pass.toLowerCase().includes(searchTerm.toLowerCase());
                        }));
                    if (!matchesSearch) return;
                }

                hasVisibleItems = true;

                // Criar grupo de credenciais
                const groupDiv = document.createElement('div');
                groupDiv.style.marginBottom = '25px';
                groupDiv.style.display = 'flex';
                groupDiv.style.flexDirection = 'column';
                
                // Se for cabeçalho (sem credenciais), ocupar a largura toda
                if (isHeader) {
                    groupDiv.style.gridColumn = '1 / -1';
                    groupDiv.style.marginTop = '10px';
                }

                // Título do grupo
                if (item.title) {
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'message-title';
                    titleDiv.style.marginBottom = isHeader ? '0' : '12px';
                    titleDiv.style.fontSize = isHeader ? '0.85em' : '0.75em';
                    titleDiv.style.opacity = isHeader ? '0.8' : '1';
                    titleDiv.textContent = item.title;
                    
                    if (isHeader) {
                        titleDiv.style.borderBottom = '1px solid rgba(167, 139, 250, 0.2)';
                        titleDiv.style.paddingBottom = '8px';
                        titleDiv.style.width = '100%';
                    }
                    
                    groupDiv.appendChild(titleDiv);
                }

                if (!isHeader) {
                    // Container para os cards de credenciais no grupo
                    const cardsContainer = document.createElement('div');
                    cardsContainer.style.display = 'grid';
                    cardsContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(150px, 1fr))';
                    cardsContainer.style.gap = '12px';

                    // Credenciais
                    item.credentials.forEach(cred => {
                        const isObject = typeof cred === 'object' && cred !== null;
                        const userText = isObject ? (cred.user || '') : '';
                        const passwordText = isObject ? cred.password : cred;

                        const credDiv = document.createElement('div');
                        credDiv.className = 'message-item password-item';
                        credDiv.style.padding = '15px 12px';
                        credDiv.style.display = 'flex';
                        credDiv.style.flexDirection = 'column';
                        credDiv.style.justifyContent = 'center';
                        credDiv.style.alignItems = 'center';
                        credDiv.style.textAlign = 'center';
                        credDiv.style.minHeight = '90px';
                        credDiv.style.margin = '0';

                        if (userText) {
                            const userSpan = document.createElement('span');
                            userSpan.style.fontSize = '0.7em';
                            userSpan.style.textTransform = 'uppercase';
                            userSpan.style.letterSpacing = '1.2px';
                            userSpan.style.marginBottom = '6px';
                            userSpan.style.opacity = '0.5';
                            userSpan.style.fontWeight = '700';
                            userSpan.style.color = body.classList.contains('dark-mode') ? '#94a3b8' : '#64748b';
                            userSpan.textContent = userText;
                            credDiv.appendChild(userSpan);
                        }

                        const passwordSpan = document.createElement('span');
                        passwordSpan.style.fontFamily = 'monospace';
                        passwordSpan.style.fontWeight = '800';
                        passwordSpan.style.fontSize = '1.05em';
                        passwordSpan.style.wordBreak = 'break-all';
                        passwordSpan.style.color = body.classList.contains('dark-mode') ? '#f1f5f9' : '#1e293b';
                        passwordSpan.textContent = passwordText;

                        credDiv.appendChild(passwordSpan);

                        // Copiar apenas a senha ao clicar
                        credDiv.addEventListener('click', (e) => {
                            e.stopPropagation();
                            copyToClipboard(passwordText);
                        });

                        cardsContainer.appendChild(credDiv);
                    });

                    groupDiv.appendChild(cardsContainer);
                }

                messagesDiv.appendChild(groupDiv);
            });

            if (!hasVisibleItems && searchTerm) return;

            topicHeader.addEventListener('click', () => {
                topicDiv.classList.toggle('active');
            });

            topicDiv.appendChild(topicHeader);
            topicDiv.appendChild(messagesDiv);
            topicsContainer.appendChild(topicDiv);
        }

        // --- Substitui variáveis e adiciona saudação automática ---
        function replaceVariables(text) {
            const attendantName = document.getElementById('attendantName').value || '';
            const now = new Date();
            const dia = String(now.getDate()).padStart(2, '0');
            const mes = String(now.getMonth() + 1).padStart(2, '0');
            const ano = String(now.getFullYear()).slice(-2);
            const hora = String(now.getHours()).padStart(2, '0');
            const minuto = String(now.getMinutes()).padStart(2, '0');

            const dataAtual = `${dia}/${mes}/${ano}`;
            const horaAtual = `${hora}:${minuto}`;

            // Saudação automática conforme o horário
            let periodo = "";
            const horaNum = now.getHours();
            if (horaNum >= 5 && horaNum < 12) {
                periodo = "Bom dia";
            } else if (horaNum >= 12 && horaNum < 18) {
                periodo = "Boa tarde";
            } else {
                periodo = "Boa noite";
            }

            // Lógica de vencimento automático
            let vencimentoAuto = "";
            const diaNum = now.getDate();
            if (diaNum >= 2 && diaNum <= 10) {
                vencimentoAuto = "02, 06 ou 09";
            } else if (diaNum >= 11 && diaNum <= 20) {
                vencimentoAuto = "13 ou 18";
            } else {
                vencimentoAuto = "22, 26 ou 01";
            }

            return text
                .replace(/\[PERIODO\]/g, periodo)
                .replace(/\[NOME_ATENDENTE\]/g, attendantName)
                .replace(/\[DATA\]/g, dataAtual)
                .replace(/\[HORA\]/g, horaAtual)
                .replace(/\[VENCIMENTO_AUTO\]/g, vencimentoAuto);
        }

        // Copiar para área de transferência
        function copyToClipboard(input) {
            const attendantNameInput = document.getElementById('attendantName');
            const attendantName = attendantNameInput.value.trim();

            if (!attendantName) {
                attendantNameInput.style.borderColor = '#ef4444';
                attendantNameInput.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.1)';
                attendantNameInput.focus();
                
                // Mostrar notificação de erro
                const notification = document.getElementById('notification');
                notification.textContent = '⚠️ Digite seu nome antes de copiar!';
                notification.style.background = '#ef4444';
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    // Resetar estilos após um tempo
                    setTimeout(() => {
                        notification.textContent = '✓ Mensagem copiada!';
                        notification.style.background = '';
                    }, 300);
                }, 2000);
                
                return;
            }

            // Resetar estilos caso o nome esteja preenchido
            attendantNameInput.style.borderColor = '';
            attendantNameInput.style.boxShadow = '';

            // Rastrear uso
            trackMessageUsage(input);

            // Se for objeto com title e content, pegar apenas o content
            const textToProcess = (typeof input === 'object' && input !== null && input.content) 
                ? input.content 
                : input;
            
            let textAtualizado = replaceVariables(textToProcess);
            
            navigator.clipboard.writeText(textAtualizado).then(() => {
                showNotification();
            }).catch(err => {
                console.error('Erro ao copiar:', err);
            });
        }

        // Mostrar notificação
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // Sistema de rastreamento de uso com data
        function trackMessageUsage(input) {
            try {
                // Se for objeto com title e content, pegar apenas o content
                const messageText = (typeof input === 'object' && input !== null && input.content) 
                    ? input.content 
                    : input;

                let usageHistory = JSON.parse(localStorage.getItem('messageUsageHistory') || '[]');
                
                // Adicionar registro de uso
                usageHistory.push({
                    text: messageText,
                    timestamp: new Date().toISOString(),
                    date: new Date().toLocaleDateString('pt-BR'),
                    time: new Date().toLocaleTimeString('pt-BR')
                });
                
                // Manter apenas últimos 1000 registros
                if (usageHistory.length > 1000) {
                    usageHistory = usageHistory.slice(-1000);
                }
                
                localStorage.setItem('messageUsageHistory', JSON.stringify(usageHistory));
            } catch (err) {
                console.error('Erro ao rastrear uso:', err);
            }
        }

        // --- Gerenciamento das Caixas de Apoio ---
        const supportBoxes = document.getElementById('supportBoxes');
        const contentWallets = document.getElementById('contentWallets');
        const contentDueDates = document.getElementById('contentDueDates');
        const boxWallets = document.getElementById('boxWallets');
        const boxDueDates = document.getElementById('boxDueDates');
        const btnWallets = document.getElementById('btnWallets');
        const btnDueDates = document.getElementById('btnDueDates');
        const closeSupportModal = document.getElementById('closeSupportModal');
        const infoBalloons = document.getElementById('infoBalloons');

        function openSupportModal(type) {
            supportBoxes.classList.add('show');
            populateSupportBoxes();
            
            if (type === 'wallets') {
                boxWallets.style.display = 'flex';
                boxDueDates.style.display = 'none';
                document.querySelector('.support-modal-header h2').innerHTML = '<span>💳</span> Carteiras de Cobrança';
            } else if (type === 'dueDates') {
                boxWallets.style.display = 'none';
                boxDueDates.style.display = 'flex';
                document.querySelector('.support-modal-header h2').innerHTML = '<span>📅</span> Vencimentos';
            }
        }

        if (btnWallets) {
            btnWallets.addEventListener('click', () => {
                openSupportModal('wallets');
                if (infoBalloons) {
                    infoBalloons.classList.add('show');
                }
            });
        }

        if (btnDueDates) {
            btnDueDates.addEventListener('click', () => {
                openSupportModal('dueDates');
                if (infoBalloons) {
                    infoBalloons.classList.add('show');
                }
            });
        }

        if (closeSupportModal) {
            closeSupportModal.addEventListener('click', () => {
                supportBoxes.classList.remove('show');
            });
        }

        // Fechar ao clicar fora do modal
        supportBoxes.addEventListener('click', (e) => {
            if (e.target === supportBoxes) {
                supportBoxes.classList.remove('show');
            }
        });

        function populateSupportBoxes() {
            // Popular Carteiras
            let walletsHtml = '<div class="support-grid">';
            supportData.wallets.forEach(item => {
                walletsHtml += `
                    <div class="support-card">
                        <div class="support-card-title">${item.city}</div>
                        <div class="support-card-info">
                            <div><span class="support-id-badge">${item.withDiscount}</span> COM DESCONTO</div>
                            <div><span class="support-id-badge">${item.noDiscount}</span> SEM DESCONTO</div>
                        </div>
                    </div>
                `;
            });
            walletsHtml += '</div>';
            contentWallets.innerHTML = walletsHtml;

            // Popular Vencimentos
            let dueDatesHtml = '';
            
            // Vencimentos Sem Proporcional
            dueDatesHtml += '<div class="support-section">';
            dueDatesHtml += '<div class="support-section-title"><span>📅</span> Sem Proporcional</div>';
            dueDatesHtml += '<div class="support-grid">';
            supportData.dueDatesNoProp.forEach(item => {
                dueDatesHtml += `
                    <div class="support-card">
                        <div class="support-card-info">
                            <div><span class="support-id-badge">ID ${item.id}</span> Vencimento Dia ${item.day}</div>
                        </div>
                    </div>
                `;
            });
            dueDatesHtml += '</div></div>';

            // Vencimentos Com Proporcional
            dueDatesHtml += '<div class="support-section">';
            dueDatesHtml += '<div class="support-section-title"><span>🔄</span> Com Proporcional</div>';
            dueDatesHtml += '<div class="support-grid">';
            supportData.dueDatesProp.forEach(item => {
                dueDatesHtml += `
                    <div class="support-card">
                        <div class="support-card-info">
                            <div><span class="support-id-badge">ID ${item.id}</span> Vencimento Dia ${item.day}</div>
                        </div>
                    </div>
                `;
            });
            dueDatesHtml += '</div></div>';
            
            contentDueDates.innerHTML = dueDatesHtml;
        }

        // Busca básica
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value;
            renderTopics(scriptData, searchTerm);
        });

        // Renderizar inicialmente
        renderTopics();

        // Atualizar variáveis quando o nome do atendente for alterado
        const attendantNameInput = document.getElementById('attendantName');
        
        // Carregar nome do atendente salvo
        const savedAttendantName = localStorage.getItem('attendantName');
        if (savedAttendantName) {
            attendantNameInput.value = savedAttendantName;
        }
        
        attendantNameInput.addEventListener('input', function() {
            // Salvar nome do atendente no localStorage
            localStorage.setItem('attendantName', attendantNameInput.value);
            // Resetar estilos de erro se começar a digitar
            if (attendantNameInput.value.trim()) {
                attendantNameInput.style.borderColor = '';
                attendantNameInput.style.boxShadow = '';
            }
            // Re-renderizar todos os tópicos com as variáveis atualizadas
            renderTopics();
        });

        }); // Fim do DOMContentLoaded
    </script>
